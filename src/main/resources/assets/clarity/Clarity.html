let _mmActive=null;
function mmDown(e,id,min,max,name,key,step=1){
  e.preventDefault();
  const track=document.getElementById(id+"_track");
  const r=track.getBoundingClientRect();
  const pct=(e.clientX-r.left)/r.width;
  const lo=document.getElementById(id+"_lo");
  const hi=document.getElementById(id+"_hi");
  const loPct=parseFloat(lo.style.left)/100;
  const hiPct=parseFloat(hi.style.left)/100;
  const loDist=Math.abs(pct-loPct),hiDist=Math.abs(pct-hiPct);
  const handle=loDist<hiDist?"lo":hiDist<loDist?"hi":pct>=hiPct?"hi":"lo";
  _mmActive={id,min,max,name,key,handle,step};
  document.getElementById(id+"_"+handle).classList.add("dragging");
  mmMove(e);
  document.addEventListener("mousemove",mmMove);
  document.addEventListener("mouseup",mmUp);
}
function mmTouch(e,id,min,max,name,key,step=1){
  const touch=e.touches[0];
  const track=document.getElementById(id+"_track");
  const r=track.getBoundingClientRect();
  const pct=(touch.clientX-r.left)/r.width;
  const lo=document.getElementById(id+"_lo");
  const hi=document.getElementById(id+"_hi");
  const loPct=parseFloat(lo.style.left)/100;
  const hiPct=parseFloat(hi.style.left)/100;
  const loDist2=Math.abs(pct-loPct),hiDist2=Math.abs(pct-hiPct);
  const handle=loDist2<hiDist2?"lo":hiDist2<loDist2?"hi":pct>=hiPct?"hi":"lo";
  _mmActive={id,min,max,name,key,handle,step};
  document.getElementById(id+"_"+handle).classList.add("dragging");
  mmTouchMove(e);
  document.addEventListener("touchmove",mmTouchMove,{passive:false});
  document.addEventListener("touchend",mmUp);
}
function mmTouchMove(e){e.preventDefault();if(_mmActive)mmMove(e.touches[0]);}
function mmMove(e){
  if(!_mmActive)return;
  const{id,min,max,name,key,handle,step=1}=_mmActive;
  const track=document.getElementById(id+"_track");
  if(!track)return;
  const r=track.getBoundingClientRect();
  let pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  let val=mmSnapToStep(min+pct*(max-min),min,step);
  const other=handle==="lo"?"hi":"lo";
  const otherEl=document.getElementById(id+"_"+other);
  const otherPct=parseFloat(otherEl.style.left)/100;
  const otherVal=mmSnapToStep(min+otherPct*(max-min),min,step);
  if(handle==="lo")val=Math.min(val,otherVal);
  else val=Math.max(val,otherVal);
  const fpct=(val-min)/(max-min)*100;
  document.getElementById(id+"_"+handle).style.left=fpct+"%";
  const _mmv=document.getElementById(id+"_"+handle+"_val");if(_mmv){if("value" in _mmv)_mmv.value=mmFmtVal(val,step);else _mmv.textContent=mmFmtVal(val,step);}
  state[name].values[key+"_lo"]=handle==="lo"?val:otherVal;
  state[name].values[key+"_hi"]=handle==="hi"?val:otherVal;
  const loEl=document.getElementById(id+"_lo");
  const hiEl=document.getElementById(id+"_hi");
  const lp=parseFloat(loEl.style.left);
  const hp=parseFloat(hiEl.style.left);
  const fill=document.getElementById(id+"_fill");
  fill.style.left=lp+"%";fill.style.width=(hp-lp)+"%";
  profileAutoSync();
}
function mmUp(){
  if(_mmActive){
    const{id,handle}=_mmActive;
    const el=document.getElementById(id+"_"+handle);
    if(el)el.classList.remove("dragging");
  }
  document.removeEventListener("mousemove",mmMove);
  document.removeEventListener("mouseup",mmUp);
  document.removeEventListener("touchmove",mmTouchMove);
  document.removeEventListener("touchend",mmUp);
  _mmActive=null;
}

/* ── Custom dropdown ── */
/* Single floating panel approach: one <div id="cdrop-float"> lives on body,
   never moves in/out of the DOM, always position:fixed relative to viewport.
   This completely avoids stacking-context / overflow / transform issues.      */
let _openDrop=null; // id of currently open dropdown
let _dropBtn=null;  // the button element that triggered the open
(function(){
  const fp=document.createElement("div");
  fp.id="cdrop-float";
  fp.style.cssText="position:fixed;z-index:9990;display:none;overflow-y:auto;overflow-x:hidden;"+
    "max-height:220px;background:#1e1e1e;border:1px solid color-mix(in srgb,var(--accent,#7c6af7) 55%,#2a2a2a);"+
    "border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);scrollbar-width:thin;scrollbar-color:var(--border,#2a2a2a) transparent;";
  document.addEventListener("DOMContentLoaded",()=>document.body.appendChild(fp));
  // also append immediately if DOM already ready
  if(document.body) document.body.appendChild(fp);
})();
function _positionFloat(btn){
  const fp=document.getElementById("cdrop-float");
  const r=btn.getBoundingClientRect();
  const fh=fp.scrollHeight;
  const spaceBelow=window.innerHeight-r.bottom-4;
  const spaceAbove=r.top-4;
  let top;
  if(spaceBelow>=Math.min(fh,220)||spaceBelow>=spaceAbove){
    top=r.bottom+2;
  } else {
    top=r.top-Math.min(fh,220)-2;
  }
  top=Math.max(4,Math.min(top,window.innerHeight-Math.min(fh,220)-4));
  fp.style.left=r.left+"px";
  fp.style.top=top+"px";
  fp.style.width=r.width+"px";
}
function dropOpen(id){
  const btn=document.getElementById(id+"_btn");
  const menu=document.getElementById(id+"_menu");
  if(!btn||!menu)return;
  // toggle: clicking open button closes it
  if(_openDrop===id){dropClose(id);return;}
  // close previous
  if(_openDrop)dropClose(_openDrop);
  const fp=document.getElementById("cdrop-float");
  fp.innerHTML=menu.innerHTML;
  btn.classList.add("open");
  _openDrop=id;
  _dropBtn=btn;
  fp.style.display="block";
  fp.scrollTop=0;
  _positionFloat(btn);
}
function dropClose(id){
  if(_openDrop!==id&&id!==undefined)return;
  const btn=_dropBtn||document.getElementById((_openDrop||id)+"_btn");
  if(btn)btn.classList.remove("open");
  const fp=document.getElementById("cdrop-float");
  if(fp){fp.style.display="none";fp.innerHTML="";}
  _openDrop=null;
  _dropBtn=null;
}
/* Route clicks inside the float panel to dropSelect */
document.addEventListener("click",function(e){
  const opt=e.target.closest(".cdrop-opt");
  if(opt&&document.getElementById("cdrop-float")?.contains(opt)){
    // data attrs injected by dropHTML: data-did data-val data-name data-key
    const did=opt.dataset.did,val=opt.dataset.val,nm=opt.dataset.nm,key=opt.dataset.key;
    if(did)dropSelect(did,val,nm,key);
    return;
  }
  // close if clicking outside
  if(_openDrop){
    if(!e.target.closest(".cdrop")&&!e.target.closest("#cdrop-float"))dropClose(_openDrop);
  }
},true);
/* Reposition on scroll/resize */
window.addEventListener("scroll",()=>{if(_openDrop&&_dropBtn)_positionFloat(_dropBtn);},true);
window.addEventListener("wheel",()=>{if(_openDrop&&_dropBtn)_positionFloat(_dropBtn);},true);
window.addEventListener("resize",()=>{if(_openDrop)dropClose(_openDrop);});
/* ── Animate individual setting row show/hide ── */
function animateSettingRow(row,show,settingsBox){
  if(show){
    row.classList.remove("setting-hidden");
  } else {
    row.classList.add("setting-hidden");
  }
  /* re-measure the drawer height only while it is mid-animation; once fully
     open (height:auto) content should reflow naturally with no glitch */
  if(settingsBox&&settingsBox.style.height&&settingsBox.style.height!=="0px"&&settingsBox.style.height!=="auto"){
    /* use a slight delay to let CSS transition measure correctly */
    clearTimeout(settingsBox._resizeTimer);
    settingsBox._resizeTimer=setTimeout(()=>{
      settingsBox.style.height=settingsBox.scrollHeight+"px";
      /* allow auto after resize */
      clearTimeout(settingsBox._autoTimer);
      settingsBox._autoTimer=setTimeout(()=>{
        settingsBox.style.height="auto";
        settingsBox.style.overflow="visible";
      },310);
    },20);
  }
}
let _dropSelectPending=false;
function dropSelect(id,val,name,key){
  _dropSelectPending=true;
  document.getElementById(id+"_label").textContent=val;
  state[name].values[key]=val;
  // update selected highlight in the hidden source menu
  document.querySelectorAll(`#${id}_menu .cdrop-opt`).forEach(el=>{
    el.classList.toggle("selected",el.dataset.val===val);
  });
  dropClose(id);
  // update showif-dependent rows in the same settings drawer
  const dropEl=document.getElementById(id);
  if(dropEl){
    const settingsBox=dropEl.closest(".settings");
    if(settingsBox){
      settingsBox.querySelectorAll("[data-showif-ctrl]").forEach(row=>{
        const ctrl=row.dataset.showifCtrl;
        const expected=row.dataset.showifVal;
        if(ctrl===key){
          const match=val===expected;
          animateSettingRow(row,match,settingsBox);
        }
      });
      settingsBox.querySelectorAll("[data-showif-or-ctrl]").forEach(row=>{
        const ctrl=row.dataset.showifOrCtrl;
        if(ctrl===key){
          const vals=(row.dataset.showifOrVals||"").split(",");
          animateSettingRow(row,vals.some(v=>v===val),settingsBox);
        }
      });
    }
  }
  profileAutoSync();
}
document.addEventListener("click",e=>{
  if(!e.target.closest(".block-picker-wrap")&&!e.target.closest(".block-picker-dropdown"))closeAllBlockPickers();
  if(!e.target.closest(".block-picker-wrap")&&!e.target.closest(".item-picker-dropdown"))closeAllItemPickers();
  if(!_dropSelectPending&&!e.target.closest(".module")&&!e.target.closest(".settings")&&!e.target.closest(".block-picker-dropdown")&&!e.target.closest(".item-picker-dropdown")&&!e.target.closest("#cdrop-float")&&!e.target.closest("#clarity-color-picker"))closeAllSettings();

});
function dropHTML(name,key,options,cur){
  const id=`dr_${name}_${key}`.replace(/[^a-z0-9_]/gi,"_");
  // data-* attrs let the floating panel's delegated click handler route selections
  // without needing inline onclick (which would reference stale closures after innerHTML clone)
  const opts=options.map(v=>`<div class="cdrop-opt${v===cur?" selected":""}" data-did="${id}" data-val="${v.replace(/"/g,'&quot;')}" data-nm="${name.replace(/"/g,'&quot;')}" data-key="${key.replace(/"/g,'&quot;')}">${v}</div>`).join("");
  return `<div class="cdrop" id="${id}">

function switchHTML(name,key,checked){

function swToggle(id,name,key){

  if(settingsBox){

        const match=String(on)===val||on===(val==="true");
        animateSettingRow(row,match,settingsBox);
      }
    });
    settingsBox.querySelectorAll(`[data-showif2-ctrl1]`).forEach(row=>{
      const c1=row.dataset.showif2Ctrl1,v1=row.dataset.showif2Val1;
      const c2=row.dataset.showif2Ctrl2,v2=row.dataset.showif2Val2;
      if(c1===key||c2===key){

        const m1=String(cur1)===v1||(cur1===(v1==="true"));

        animateSettingRow(row,m1&&m2,settingsBox);
      }
    });
    settingsBox.querySelectorAll(`[data-showif-or-ctrl]`).forEach(row=>{

        const cur=state[name].values[ctrl]??getDefaultVal(name,ctrl);
        animateSettingRow(row,vals.some(v=>String(cur)===v),settingsBox);

function renderBlockDropdown(id,name,key,query){
  const selected=state[name].values[key]||[];
  const q=query.toLowerCase().trim();
  const groups={};
  BLOCKS.forEach(b=>{
    const match=!q||(b.name.toLowerCase().includes(q)||b.id.includes(q)||b.group.toLowerCase().includes(q));
    if(match){
      if(!groups[b.group])groups[b.group]=[];
      groups[b.group].push(b);
    }
  });
  const entries=Object.entries(groups);
  if(!entries.length)return `<div class="bp-empty">No blocks found</div>`;
  return entries.map(([group,blocks])=>`
    <div class="bp-group-label">${group}</div>
    ${blocks.map(b=>{
      const sel=selected.includes(b.id);
      return `<div class="bp-item${sel?" selected":""}" onclick="blockPickerToggle('${id}','${name}','${key}','${b.id}',event)">

function renderItemDropdown(id,name,key,query){
  const selected=state[name].values[key]||[];
  const q=query.toLowerCase().trim();
  // Deduplicate ITEMS by id (some ids appear multiple times across groups - show each id once per group)
  const seen=new Set();
  const groups={};
  ALL_ITEMS.forEach(it=>{
    const match=!q||(it.name.toLowerCase().includes(q)||it.id.includes(q)||it.group.toLowerCase().includes(q));
    if(match){
      const uniqKey=it.group+":"+it.id;
      if(seen.has(uniqKey))return;
      seen.add(uniqKey);
      if(!groups[it.group])groups[it.group]=[];
      groups[it.group].push(it);
    }
  });
  const entries=Object.entries(groups);
  if(!entries.length)return `<div class="bp-empty">No items found</div>`;
  return entries.map(([group,items])=>`
    <div class="bp-group-label">${group}</div>
    ${items.map(it=>{
      const sel=selected.includes(it.id);
      return `<div class="bp-item${sel?" selected":""}" onclick="itemPickerToggle('${id}','${name}','${key}','${it.id}',event)">
        <div class="bp-item-icon">${blockTexImg(it.id,"")}</div>
        <div class="bp-item-info">
          <div class="bp-item-name">${it.name}</div>
          <div class="bp-item-id">minecraft:${it.id}</div>
        </div>
        <div class="bp-item-check"></div>
      </div>`;
    }).join("")}
  `).join("");
}

let _keybindActive=null;
function keybindHTML(name,key,val){
  const id=`kb_${name}_${key}`.replace(/[^a-z0-9_]/gi,"_");
  const cur=state[name].values[key]??val;
  const bound=cur&&cur!=="NONE";
  return `<button class="ckeybind${bound?" bound":""}" id="${id}" onclick="keybindStart(event,'${id}','${name}','${key}')">
    <span class="ckeybind-label" id="${id}_label">${bound?cur:"None"}</span>
  </button>`;
}
function keybindStart(e,id,name,key){
  e.stopPropagation();
  if(_keybindActive&&_keybindActive!==id){keybindCancel(_keybindActive);}
  const btn=document.getElementById(id);
  if(btn.classList.contains("listening")){keybindCancel(id);return;}
  btn.classList.add("listening");
  document.getElementById(id+"_label").textContent="\u2026";
  _keybindActive=id;
  function onKey(ev){
    ev.preventDefault();ev.stopPropagation();
    let label;
    if(ev.key==="Escape"){label="NONE";}
    else if(ev.key==="Backspace"||ev.key==="Delete"){label="NONE";}
    else{label=ev.key.length===1?ev.key.toUpperCase():ev.key;}
    state[name].values[key]=label;
    const bound=label!=="NONE";
    btn.classList.remove("listening");
    btn.classList.toggle("bound",bound);
    document.getElementById(id+"_label").textContent=bound?label:"None";
    _keybindActive=null;
    document.removeEventListener("keydown",onKey,true);
    profileAutoSync();
  }
  document.addEventListener("keydown",onKey,true);
}
function keybindCancel(id){
  const btn=document.getElementById(id);
  if(!btn)return;
  btn.classList.remove("listening");
  const name_key=id.replace(/^kb_/,"");
  document.getElementById(id+"_label").textContent=btn.classList.contains("bound")
    ?document.getElementById(id+"_label").textContent
    :"None";
  _keybindActive=null;
}

function moduleKeybindStart(e,name){

  if(window._mksKey)window.removeEventListener("keydown",window._mksKey,true);

/* ── settingHTML ── */
// s format: [label, type, data, optionalMeta]
// For minmax:  [label, "minmax", [min,max,defLo,defHi], optionalMeta]
// optionalMeta: { showif: [controlKey, value] }
// showif val can be a string (for select) or true/false (for check)
function settingShowifAttr(s){
  const meta=s[s.length-1];
  if(meta&&typeof meta==="object"&&!Array.isArray(meta)){
    if(meta.showifOr){
      const[ctrl,vals]=meta.showifOr;
      return ` data-showif-or-ctrl="${ctrl}" data-showif-or-vals="${vals.join(',')}"`;
    }
    if(meta.showif2){
      const[ctrl1,val1,ctrl2,val2]=meta.showif2;
      return ` data-showif2-ctrl1="${ctrl1}" data-showif2-val1="${val1}" data-showif2-ctrl2="${ctrl2}" data-showif2-val2="${val2}"`;
    }
    if(meta.showif){
      const[ctrl,val]=meta.showif;
      return ` data-showif-ctrl="${ctrl}" data-showif-val="${val}"`;
    }
  }
  return "";
}
function settingIsVisible(name,s){
  const meta=s[s.length-1];
  if(!meta||typeof meta!=="object"||Array.isArray(meta))return true;
  if(meta.showifOr){
    const[ctrl,vals]=meta.showifOr;
    const cur=state[name].values[ctrl]??getDefaultVal(name,ctrl);
    return vals.some(v=>String(cur)===String(v));
  }
  if(meta.showif2){
    const[ctrl1,exp1,ctrl2,exp2]=meta.showif2;
    const cur1=state[name].values[ctrl1]??getDefaultVal(name,ctrl1);
    const cur2=state[name].values[ctrl2]??getDefaultVal(name,ctrl2);
    const m1=typeof exp1==="boolean"?cur1===exp1:String(cur1)===String(exp1);
    const m2=typeof exp2==="boolean"?cur2===exp2:String(cur2)===String(exp2);
    return m1&&m2;
  }
  if(!meta.showif)return true;
  const[ctrl,expected]=meta.showif;
  const cur=state[name].values[ctrl]??getDefaultVal(name,ctrl);
  if(typeof expected==="boolean")return cur===expected;
  return String(cur)===String(expected);
}
function settingHTML(name,s){
  if(!s)return "";
  const label=`<span class="setting-label">${s[0]}</span>`;
  const si=settingShowifAttr(s);
  const hidden=settingIsVisible(name,s)?"":' data-initially-hidden="1"';
  if(s[1]==="range"){
    const val=state[name].values[s[0]]??s[2][2];
    const step=s[2][3]??1;
    return `<div class="setting${hidden?" setting-hidden":""}"${si}>${label}${sliderHTML(name,s[0],s[2][0],s[2][1],val,step)}</div>`;
  }
  if(s[1]==="minmax"){
    const valLo=state[name].values[s[0]+"_lo"]??s[2][2];
    const valHi=state[name].values[s[0]+"_hi"]??s[2][3];
    const step=s[2][4]??1;
    return `<div class="setting${hidden?" setting-hidden":""}"${si}>${label}${minmaxHTML(name,s[0],s[2][0],s[2][1],valLo,valHi,step)}</div>`;
  }
  if(s[1]==="check"){
    const on=state[name].values[s[0]]??s[2];
    return `<div class="setting${hidden?" setting-hidden":""}"${si}>${label}${switchHTML(name,s[0],on)}</div>`;
  }
  if(s[1]==="select"){
    const cur=state[name].values[s[0]]??s[3];
    return `<div class="setting${hidden?" setting-hidden":""}"${si}>${label}${dropHTML(name,s[0],s[2],cur)}</div>`;
  }
  if(s[1]==="color"){
    const val=state[name].values[s[0]]??s[2];
    const bg=themeSwatchColor(val);
    return `<div class="setting${hidden?" setting-hidden":""}"${si}>${label}<div class="color-swatch-btn" style="background:${bg}" data-value="${val}" title="${val==="theme"?"Theme accent":val==="theme2"?"Theme accent 2":val}" onclick="openColorPicker(event,'${name}','${s[0]}',this)"></div></div>`;
  }
  if(s[1]==="blockpicker"){
    if(!state[name].values[s[0]])state[name].values[s[0]]=[];
    return blockPickerHTML(name,s[0]);
  }
  if(s[1]==="itempicker"){
    if(!state[name].values[s[0]])state[name].values[s[0]]=[];
    return itemPickerHTML(name,s[0]);
  }
  if(s[1]==="keybind"){
    const val=state[name].values[s[0]]??s[2];
    return `<div class="setting${hidden?" setting-hidden":""}"${si}>${label}${keybindHTML(name,s[0],val)}</div>`;
  }
  if(s[1]==="multiselect"){
    const opts=s[2];
    const cur=state[name].values[s[0]]??(s[3]||[]);
    if(!state[name].values[s[0]])state[name].values[s[0]]=cur.slice();
    const chips=opts.map(o=>{
      const on=state[name].values[s[0]].includes(o);
      const id=`ms_${name}_${s[0]}_${o}`.replace(/[^a-z0-9_]/gi,"_");
      return `<span class="cmulti-chip${on?" on":""}" id="${id}" onclick="multiToggle('${name}','${s[0]}','${o}','${id}')">${o}</span>`;
    }).join("");
    return `<div class="setting${hidden?" setting-hidden":""}"${si} style="align-items:flex-start;flex-direction:column;gap:8px"><span class="setting-label">${s[0]}</span><div class="cmulti">${chips}</div></div>`;
  }
  if(s[1]==="coords"){
    if(!state[name].values[s[0]])state[name].values[s[0]]=s[2]||[0,0,0];
    return `<div class="setting${hidden?" setting-hidden":""}"${si} style="align-items:flex-start;flex-direction:column;gap:8px"><span class="setting-label">${s[0]}</span>${coordsHTML(name,s[0],s[2])}</div>`;
  }
  if(s[1]==="capeselect"){
    if(!state[name].values[s[0]])state[name].values[s[0]]=s[2]||"none";
    return `<div class="setting${hidden?" setting-hidden":""}"${si} style="align-items:flex-start;flex-direction:column;gap:0;padding:0">${capeSelectHTML(name,s[0])}</div>`;
  }
  if(s[1]==="text"){
    const val=state[name].values[s[0]]??s[2]??"";
    const eid=`txt_${name}_${s[0]}`.replace(/[^a-z0-9_]/gi,"_");
    return `<div class="setting${hidden?" setting-hidden":""}"${si}>${label}<input class="csetting-text" id="${eid}" type="text" value="${String(val).replace(/"/g,'&quot;')}" placeholder="${s[3]||""}" oninput="state['${name}'].values['${s[0]}']=this.value;profileAutoSync()"></div>`;
  }
  if(s[1]==="alpreview"){
    return `<div class="setting al-preview-wrap"><canvas id="al-preview-canvas" width="260" height="150"></canvas><div class="al-preview-hint">Live preview · reflects currently enabled modules</div></div>`;
  }
  return "";
}
function getDefaultVal(name,key){
  const settings=moduleSettings[name]||[];
  for(const s of settings){
    if(s[0]===key){
      if(s[1]==="check")return s[2];
      if(s[1]==="select")return s[3];
    }
  }
  return undefined;
}

// Timestamp of the last user-initiated change.  syncEnabledFromServer() will
// not overwrite local state until at least 1 s has passed - this prevents the
// poll from racing with the debounced POST and un-doing a fresh toggle.
let _lastUserAction = 0;

function toggleModule(name){
  if(_modKbListening)return;
  _lastUserAction = Date.now();
  state[name].enabled=!state[name].enabled;
  // Enabling Ambience turns on all its "types" - reflect that in the GUI too.
  if(name==="Ambience"&&state[name].enabled){
    ["Override Time","Override Weather","Override Fog Colour","Override Fog Distance","Override Lightmap","Override Sky Colour"]
      .forEach(k=>{state[name].values[k]=true;});
    const box=document.getElementById("settings-"+CSS.escape(name));
    if(box){
      const settings=(moduleSettings[name]||[]).map(s=>settingHTML(name,s)).join("");
      box.innerHTML=moduleKeybindRow(name)+(settings||"")+settingsResetRow(name);
    }
  }
  const el=document.querySelector(`[data-module="${CSS.escape(name)}"]`);
  if(el)el.classList.toggle("enabled",state[name].enabled);
  const wrap=el?.closest(".module-wrap");
  if(wrap&&wrap.classList.contains("settings-active")){
    wrap.classList.toggle("module-enabled",state[name].enabled);
  }
  profileAutoSync();
}
function settingsAnimate(box, open){
  // Bump a generation so any pending transitionend from a previous direction
  // knows it is stale and must not apply its side-effects.
  const gen = (box._animGen = (box._animGen || 0) + 1);
  if(open){
    box.style.overflow="hidden";
    box.style.height="0";
    const inner=box.scrollHeight;
    box.style.height=inner+"px";
    const done=()=>{
      if(box._animGen!==gen)return; // stale - a close already started
      box.style.height="auto";
      box.style.overflow="visible";
      box.removeEventListener("transitionend",done);
    };
    box.addEventListener("transitionend",done);
  } else {
    // If height is currently "auto" (open-transition finished), snap to px first
    box.style.overflow="hidden";
    if(box.style.height==="auto"||box.style.height===""){
      box.style.height=box.scrollHeight+"px";
      void box.offsetHeight; // force reflow
    } else {
      // mid-open: scrollHeight is still accurate, just override to measured px
      const cur=parseFloat(box.style.height)||box.scrollHeight;
      box.style.height=cur+"px";
      void box.offsetHeight;
    }
    box.style.height="0";
  }
}

function _c1OrderKey(cat){return "clarity_order_"+String(cat);}
function _c1GetOrder(cat){
  try{const a=JSON.parse(localStorage.getItem(_c1OrderKey(cat))||"[]");return Array.isArray(a)?a:[];}catch(e){return [];}
}
function _c1SetOrder(cat,arr){
  try{localStorage.setItem(_c1OrderKey(cat),JSON.stringify(arr||[]));}catch(e){}
}
function _c1OrderedMods(cat){
  const mods=(categories[cat]||[]).slice();
  const ord=_c1GetOrder(cat);
  if(!ord.length)return mods;
  const idx=new Map();
  ord.forEach((n,i)=>{if(!idx.has(n))idx.set(n,i);});
  return mods.map((m,i)=>({m:m,i:i})).sort((a,b)=>{
    const ia=idx.has(a.m[0])?idx.get(a.m[0]):1e9;
    const ib=idx.has(b.m[0])?idx.get(b.m[0]):1e9;
    return (ia-ib)||(a.i-b.i);
  }).map(x=>x.m);
}
function _c1GetCollapsed(name){
  try{const o=JSON.parse(localStorage.getItem("clarity_collapsed")||"{}");return !!(o&&o[name]);}catch(e){return false;}

function _c1SetCollapsed(name,v){

(function(){
  let _dragName=null,_dragCat=null;
  function _cleanup(){
    document.querySelectorAll(".module-wrap.c1-dragging,.module-wrap.c1-drag-over").forEach(w=>w.classList.remove("c1-dragging","c1-drag-over"));
    _dragName=null;_dragCat=null;
  }
  function _wrapOf(t){return (t&&t.closest)?t.closest(".module-wrap"):null;}
  document.addEventListener("dragstart",e=>{
    const wrap=_wrapOf(e.target);
    if(!wrap)return;
    const mod=wrap.querySelector(".module[data-module]");
    if(!mod)return;
    _dragName=mod.getAttribute("data-module")||null;
    _dragCat=currentCategory||null;
    wrap.classList.add("c1-dragging");
    try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",_dragName||"");}catch(_){}
  });
  document.addEventListener("dragover",e=>{
    const wrap=_wrapOf(e.target);
    if(!wrap||!_dragName||wrap.classList.contains("c1-dragging"))return;
    e.preventDefault();
    try{e.dataTransfer.dropEffect="move";}catch(_){}
    document.querySelectorAll(".module-wrap.c1-drag-over").forEach(w=>{if(w!==wrap)w.classList.remove("c1-drag-over");});
    wrap.classList.add("c1-drag-over");
  });
  document.addEventListener("dragleave",e=>{
    const wrap=_wrapOf(e.target);
    if(wrap)wrap.classList.remove("c1-drag-over");
  });
  document.addEventListener("drop",e=>{
    const wrap=_wrapOf(e.target);
    if(!wrap||!_dragName){_cleanup();return;}
    e.preventDefault();
    const tm=wrap.querySelector(".module[data-module]");
    const target=tm?tm.getAttribute("data-module"):null;
    const cat=_dragCat,moved=_dragName;
    _cleanup();
    if(!cat||!target||target===moved)return;
    const names=_c1OrderedMods(cat).map(m=>m[0]);
    const from=names.indexOf(moved),to=names.indexOf(target);
    if(from<0||to<0)return;
    names.splice(from,1);names.splice(to,0,moved);
    _c1SetOrder(cat,names);
    if(_currentGuiStyle==="Classic"){renderClassicPanel();}
    else{showCategory(cat,document.querySelector(".category.active"));}
  });
  document.addEventListener("dragend",_cleanup);
})();

function classicKbOpen(name){
  // Toggle off if already listening for this module
  if(_modKbListening===name){classicKbStop(name);return;}
  if(_modKbListening)classicKbStop(_modKbListening);
  _modKbListening=name;
  const row=document.querySelector(`[data-module="${CSS.escape(name)}"]`);
  if(row)row.classList.add("kb-listening");

  function onKey(e){
    if(["Shift","Control","Alt","Meta","CapsLock","Tab"].includes(e.key))return;
    e.preventDefault();e.stopPropagation();
    const bind=e.key==="Escape"?null:(e.key.length===1?e.key.toUpperCase():e.key);
    state[name].bind=bind||null;
    classicKbStop(name);
    classicKbRenderBadge(name);
    profileAutoSync();
  }
  function onMouse(e){
    if(e.button===1)return;
    if(e.target.closest(".kb-inline-mode-btn"))return;
    e.preventDefault();e.stopPropagation();
    const names=["Left Click","Middle Click","Right Click","Mouse 4","Mouse 5","Mouse 6","Mouse 7","Mouse 8"];
    state[name].bind=names[e.button]||`Mouse ${e.button}`;
    classicKbStop(name);
    classicKbRenderBadge(name);
    profileAutoSync();
  }
  window._ckbKey=onKey;window._ckbMouse=onMouse;
  window.addEventListener("keydown",onKey,{capture:true});
  window.addEventListener("mousedown",onMouse,{capture:true});
}

function classicKbStop(name){
  _modKbListening=null;
  const row=document.querySelector(`[data-module="${CSS.escape(name)}"]`);
  if(row)row.classList.remove("kb-listening");
  if(window._ckbKey)window.removeEventListener("keydown",window._ckbKey,true);
  if(window._ckbMouse)window.removeEventListener("mousedown",window._ckbMouse,true);
  window._ckbKey=null;window._ckbMouse=null;
}

function profilesGetActiveId(){return localStorage.getItem(activeProfileKey)||null}
function profilesSetActiveId(id){id===null?localStorage.removeItem(activeProfileKey):localStorage.setItem(activeProfileKey,id)}
function captureCurrentConfig(){
  const s=JSON.parse(JSON.stringify(state));
  if(_customCapes.length)s.__customCapes=JSON.parse(JSON.stringify(_customCapes));
  s.__theme=captureThemeConfig();
  /* Reserved mirrors so the Java side can read them with the profiles.
     __binds:          [ { id, name, locked, binds:{ moduleName:{ bind, bindMode } } } ]
     __serverProfiles: { "address[:port]": "profileName" }
     __profiles:       { "profileName": <profile data snapshot> } */
  try{s.__binds=bindsEnsureIds();}catch(e){}
  try{s.__serverProfiles=serverProfilesLoad();}catch(e){}
  try{
    const profs={};
    profilesLoad().forEach(p=>{
      if(!p||!p.name)return;
      const snap=JSON.parse(JSON.stringify(p.data||{}));
      /* strip global mirror blobs so snapshots cannot recursively nest */
      delete snap.__profiles;delete snap.__binds;delete snap.__serverProfiles;
      profs[p.name]=snap;
    });
    s.__profiles=profs;
  }catch(e){}
  return s;
}
function applyProfileConfig(data){
  Object.keys(state).forEach(k=>{if(data[k])state[k]=JSON.parse(JSON.stringify(data[k]))});
  Object.keys(state).forEach(k=>{
    if(!state[k]||typeof state[k]!=="object")state[k]={enabled:false,values:{},bind:null,bindMode:"toggle"};
    if(state[k].bind===undefined)state[k].bind=null;
    if(!state[k].bindMode)state[k].bindMode="toggle";
  });
  // restore custom capes stored in the profile
  if(data.__customCapes)_customCapes=JSON.parse(JSON.stringify(data.__customCapes));
  showCategory(currentCategory,document.querySelector(".category.active"));
  // POST the full new state immediately so the Java side gets the new enabled
  // flags and calls syncFromConfig() -> onEnable()/onDisable() on live modules.
  // Direct fetch (not debounced) so it fires right away.
  const payload=captureCurrentConfig();
  fetch("http://localhost:7420/config",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  }).catch(()=>{});
}

const bindsKey="clarity_binds";

function bindsLoad(){try{const a=JSON.parse(localStorage.getItem(bindsKey)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}

function bindsEnsureIds(){

  sets.forEach(s=>{

function _captureCurrentBinds(){
  const out={};

      bind:(state[m]&&state[m].bind!==undefined)?state[m].bind:null,

  const prof=sel.value;

function guiRoundingDrag(e,key,max){
  e.preventDefault();
  const track=e.currentTarget;
  function update(clientX){
    const r=track.getBoundingClientRect();
    let pct=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    const val=Math.round(pct*max);
    document.getElementById('rfill_'+key).style.width=(pct*100)+'%';
    document.getElementById('rthumb_'+key).style.left=(pct*100)+'%';
    document.getElementById('rval_'+key).textContent=val+'px';
    setRounding(key,val);
  }
  function onMove(ev){update(ev.touches?ev.touches[0].clientX:ev.clientX);}
  function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);}
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchmove',onMove);
  document.addEventListener('touchend',onUp);
  update(e.touches?e.touches[0].clientX:e.clientX);
}

function guiRoundingReset(){
  localStorage.removeItem('clarity_rounding');
  Object.entries(_roundingVars).forEach(([k,v])=>{
    document.documentElement.style.setProperty(v,_roundingDefaults[k]+'px');
  });
  renderGuiPanel();

}

const _classicUiDefaults={

function getClassicUi(key){
  try{const s=JSON.parse(localStorage.getItem('clarity_classic_ui')||'{}');return s[key]!==undefined?s[key]:_classicUiDefaults[key]}
  catch(e){return _classicUiDefaults[key];}
}
function setClassicUi(key,val){
  try{const s=JSON.parse(localStorage.getItem('clarity_classic_ui')||'{}');s[key]=val;localStorage.setItem('clarity_classic_ui',JSON.stringify(s));}catch(e){}
  applyClassicUi();renderGuiPanel();

function applyClassicUi(){
  const root=document.documentElement;
  const body=document.body;
  // Toggle style classes
  ['dot','pill','square','check'].forEach(s=>body.classList.remove('classic-toggle-'+s));
  const ts=getClassicUi('toggleStyle');
  if(ts!=='dot')body.classList.add('classic-toggle-'+ts);
  // Toggle size
  const tszMap={sm:10,md:13,lg:16};
  root.style.setProperty('--classic-toggle-sz',(tszMap[getClassicUi('toggleSize')]||13)+'px');
  // Row density
  const padMap={compact:4,default:7,comfortable:11};
  root.style.setProperty('--classic-row-pad',(padMap[getClassicUi('density')]||7)+'px');
  // Name size
  const nsMap={sm:11,md:12,lg:14};
  root.style.setProperty('--classic-name-size',(nsMap[getClassicUi('nameSize')]||12)+'px');
  // Label size
  const lsMap={sm:10,md:11,lg:13};
  root.style.setProperty('--classic-label-size',(lsMap[getClassicUi('labelSize')]||11)+'px');
  // Slider width
  const swMap={narrow:60,default:80,wide:110};
  root.style.setProperty('--classic-slider-w',(swMap[getClassicUi('sliderW')]||80)+'px');
  // Slider height
  const shMap={thin:3,default:5,thick:8};
  root.style.setProperty('--classic-slider-h',(shMap[getClassicUi('sliderH')]||5)+'px');
  // Settings CSW size
  const cswPresets={sm:{w:24,h:13,dot:7,pad:3},default:{w:30,h:16,dot:10,pad:3},lg:{w:38,h:20,dot:13,pad:3.5}};
  const csw=cswPresets[getClassicUi('cswSize')]||cswPresets.default;
  root.style.setProperty('--classic-csw-w',csw.w+'px');
  root.style.setProperty('--classic-csw-h',csw.h+'px');
  root.style.setProperty('--classic-csw-dot',csw.dot+'px');
  root.style.setProperty('--classic-csw-pad',csw.pad+'px');
  // Accent bar
  body.classList.toggle('classic-no-accent-bar',!getClassicUi('accentBar'));
  // Arrow visibility
  ['classic-arrow-hover','classic-arrow-hidden'].forEach(c=>body.classList.remove(c));
  const av=getClassicUi('arrowVis');
  if(av==='hover')body.classList.add('classic-arrow-hover');
  else if(av==='hidden')body.classList.add('classic-arrow-hidden');
  // Category header style
  ['classic-cat-minimal','classic-cat-bold'].forEach(c=>body.classList.remove(c));
  const cs=getClassicUi('catStyle');
  if(cs==='minimal')body.classList.add('classic-cat-minimal');
  else if(cs==='bold')body.classList.add('classic-cat-bold');
}

  const ch=[0,2,4].map(i=>Math.max(0,Math.min(255,parseInt(n.slice(i,i+2),16)+amt)));
  return "#"+ch.map(v=>v.toString(16).padStart(2,"0")).join("");
}

function applyTheme(name){

  } else {
    v["--text"]="#ededf0";v["--muted"]="#8b8b93";v["--muted2"]="#5a5a63";
    v["--surface2"]=_lighter(surface,7);v["--surface3"]=_lighter(surface,14);
    v["--border"]=p[4]||_lighter(surface,18);v["--border2"]=_lighter(surface,26);
  }
  for(const k in v) document.documentElement.style.setProperty(k,v[k]);
  // Setting a theme also sets Ambience's "types" (sky/fog follow the theme).
  try{
    if(state["Ambience"]){
      ["Override Time","Override Weather","Override Fog Colour","Override Fog Distance","Override Lightmap","Override Sky Colour"]
        .forEach(k=>{state["Ambience"].values[k]=true;});
      const abox=document.getElementById("settings-"+CSS.escape("Ambience"));
      if(abox){
        const aset=(moduleSettings["Ambience"]||[]).map(s=>settingHTML("Ambience",s)).join("");
        abox.innerHTML=moduleKeybindRow("Ambience")+(aset||"")+settingsResetRow("Ambience");
      }
    }
  }catch(e){}
  try{localStorage.setItem("clarity_theme",name);localStorage.setItem("clarity_theme_vars",JSON.stringify(v));}catch(e){}
  if(__bootstrapped)profileAutoSync();
  const ctEntry=getCustomThemes()[name];
  let tbg=THEME_BG[name];
  if(!tbg && ctEntry && ctEntry.bgPreset) tbg=(ctEntry.bgPreset==="Keep")?null:ctEntry.bgPreset;

function _rgbHex(r,g,b){return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");}
function _lum(r,g,b){return 0.2126*r+0.7152*g+0.0722*b;}
function _sat(r,g,b){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?((mx-mn)/mx):0;}
function paletteFromImage(img){
  const c=document.createElement("canvas");
  const w=90,h=Math.max(1,Math.round(90*img.height/Math.max(1,img.width)));
  c.width=w;c.height=h;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,0,0,w,h);
  let data;try{data=ctx.getImageData(0,0,w,h).data;}catch(e){return null;}
  const bins={};let rs=0,gs=0,bs=0,n=0;
  for(let i=0;i<data.length;i+=4){
    if(data[i+3]<128)continue;
    const r=data[i],g=data[i+1],b=data[i+2];
    rs+=r;gs+=g;bs+=b;n++;
    const key=((r>>4)<<8)|((g>>4)<<4)|(b>>4);
    bins[key]=(bins[key]||0)+1;
  }
  if(!n)return null;
  const avg=[rs/n,gs/n,bs/n];
  const light=_lum(avg[0],avg[1],avg[2])>150;
  const dom=Object.keys(bins).sort((a,b)=>bins[b]-bins[a]).slice(0,24)
    .map(k=>[((k>>8)&15)*17,((k>>4)&15)*17,(k&15)*17]);
  let bg;
  if(light){
    bg=[avg[0]*0.15+255*0.85,avg[1]*0.15+255*0.85,avg[2]*0.15+255*0.85];
  }else{
    const dark=dom.slice().sort((a,b)=>_lum(a[0],a[1],a[2])-_lum(b[0],b[1],b[2]))[0];
    const base=_lum(dark[0],dark[1],dark[2])<_lum(avg[0],avg[1],avg[2])?dark:avg;
    bg=[base[0]*0.28,base[1]*0.28,base[2]*0.28];
  }
  let accent=dom.slice().sort((a,b)=>
    (_sat(b[0],b[1],b[2])*1.3+_lum(b[0],b[1],b[2])/255)-
    (_sat(a[0],a[1],a[2])*1.3+_lum(a[0],a[1],a[2])/255))[0]||avg;
  if(_sat(accent[0],accent[1],accent[2])<0.18||_lum(accent[0],accent[1],accent[2])<45){
    accent=[Math.max(avg[0],110),Math.max(avg[1],120),Math.max(avg[2],150)];
  }
  return {accent:_rgbHex(...accent),bg:_rgbHex(...bg),light:light};
}

/* ── Adaptive text contrast over photo backgrounds ── */
function _cssUrl(css){const m=/^url\(["']?(.*?)["']?\)$/.exec(css||"");return m?m[1]:null;}

function _acArm(){_acArmed=true;}
function _setAdaptiveBg(url){
  if(!url||(!/\.(jpe?g|png|webp)/i.test(url)&&!url.startsWith("data:image/jpeg"))){
    _bgImg=null;_bgImgUrl=null;document.body.classList.remove("adaptive-contrast");
    _acApplied.forEach(el=>{el.style.color="";el.classList.remove("ac-adapt");});_acApplied=[];
    return;
  }
  if(url===_bgImgUrl&&_bgImg&&_bgImg.complete){applyAdaptiveContrast();return;}
  _bgImgUrl=url;
  const im=new Image();
  im.onload=()=>{_bgImg=im;document.body.classList.add("adaptive-contrast");applyAdaptiveContrast();};
  im.onerror=()=>{_bgImg=null;};
  im.src=url;
}
let _acApplied=[];
function _acCovered(el){
  if(el.closest(".module,.module-wrap,.settings,.nav,.theme-card,.gui-style-card,.profile-card,.bg-chip,.ct-field,.setting,.te-modal")) return true;
  let n=el;
  while(n&&n!==document.body){
    const s=getComputedStyle(n);
    const m=/rgba?\(([^)]+)\)/.exec(s.backgroundColor);
    if(m){const p=m[1].split(",").map(v=>parseFloat(v));if((p.length>3?p[3]:1)>0.6)return true;}
    if(s.backgroundImage&&s.backgroundImage!=="none")return true;
    n=n.parentElement;
  }
  return false;
}
function _acCandidates(){
  const out=[];
  (function walk(node){
    for(const el of node.children){
      if(_acCovered(el))continue;
      let hasText=false;
      for(const c of el.childNodes){if(c.nodeType===3&&c.textContent.trim()){hasText=true;break;}}
      if(hasText)out.push(el);
      walk(el);
    }
  })(document.body);
  return out;
}
function applyAdaptiveContrast(){
  if(!_bgImg||!document.body.classList.contains("adaptive-contrast")){
    _acApplied.forEach(el=>{el.style.color="";el.classList.remove("ac-adapt");});_acApplied=[];
    return;
  }
  const vw=window.innerWidth,vh=window.innerHeight;

function importBackground(file){

  const reader=new FileReader();
  reader.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const scale=Math.min(1,1920/Math.max(1,im.width));
      const w=Math.max(1,Math.round(im.width*scale)), h=Math.max(1,Math.round(im.height*scale));
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const ctx=c.getContext("2d",{willReadFrequently:true});
      ctx.drawImage(im,0,0,w,h);
      let sum=0,n=0;
      try{const d=ctx.getImageData(0,0,w,h).data;for(let i=0;i<d.length;i+=16){sum+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];n++;}}catch(e){}

let _modKbListening=null;  // module name currently capturing a key
let _modKbOpenPopup=null;  // module name whose popup is open

function _modKbSafeId(name){return`mkb_${name}`.replace(/[^a-z0-9_]/gi,"_")}

function modKbOpenPopup(name){
  // Toggle: middle-clicking again cancels listening
  if(_modKbListening===name){modKbStopListen(name);return;}
  // Stop any other active listening first
  if(_modKbListening)modKbStopListen(_modKbListening);
  _modKbOpenPopup=name;
  modKbStart(name);
}
function modKbClosePopup(name){
  modKbStopListen(name);
  if(_modKbOpenPopup===name)_modKbOpenPopup=null;
}

function modKbStart(name){
  if(_modKbListening===name){modKbStopListen(name);return;}
  if(_modKbListening)modKbStopListen(_modKbListening);
  _modKbListening=name;
  // Show inline listening state directly on the module
  const moduleEl=document.querySelector(`[data-module="${CSS.escape(name)}"]`);
  if(moduleEl)moduleEl.classList.add("kb-listening");

  function onKey(e){
    if(["Shift","Control","Alt","Meta","CapsLock","Tab"].includes(e.key))return;
    e.preventDefault();e.stopPropagation();
    const clear=e.key==="Escape";
    const bind=clear?null:(e.key.length===1?e.key.toUpperCase():e.key);
    modKbCommit(name,bind);
  }
  function onMouse(e){
    // middle-click: let onauxclick toggle handler deal with it
    if(e.button===1)return;
    // let mode-button clicks fall through so Toggle/Hold still work
    if(e.target.closest(".kb-inline-mode-btn"))return;
    e.preventDefault();e.stopPropagation();
    const names=["Left Click","Middle Click","Right Click","Mouse 4","Mouse 5","Mouse 6","Mouse 7","Mouse 8"];
    modKbCommit(name,names[e.button]||`Mouse ${e.button}`);
  }
  window._modKbKeyHandler=onKey;
  window._modKbMouseHandler=onMouse;
  window.addEventListener("keydown",onKey,{capture:true});
  window.addEventListener("mousedown",onMouse,{capture:true});
}

function modKbCommit(name,bind){
  state[name].bind=bind||null;
  modKbStopListen(name);
  modKbRenderBadge(name);
  profileAutoSync();
}

function modKbStopListen(name){
  _modKbListening=null;
  if(_modKbOpenPopup===name)_modKbOpenPopup=null;
  // Remove inline listening state from the module
  const moduleEl=document.querySelector(`[data-module="${CSS.escape(name)}"]`);
  if(moduleEl)moduleEl.classList.remove("kb-listening");
  if(window._modKbKeyHandler)window.removeEventListener("keydown",window._modKbKeyHandler,true);
  if(window._modKbMouseHandler)window.removeEventListener("mousedown",window._modKbMouseHandler,true);
  window._modKbKeyHandler=null;window._modKbMouseHandler=null;
}

/* ── Enabled-state sync poll ── */
// The game (Java/KeybindHandler) is the sole authority for keybind toggles.
// The UI must NEVER independently toggle modules on keydown - doing so races
// against the game and causes the 150 ms debounced POST to overwrite the
// correct game-side state with a stale UI-side state.
//
// Instead, the UI polls GET /config every 500 ms and refreshes only the
// enabled flags + badge visibility from the server response, without
// re-rendering the entire panel. This keeps the UI accurate after in-game
// keybind toggles while the browser tab is open.
// How long (ms) after a user action before the poll is allowed to overwrite
// local enabled-state again.  Must be longer than the profileAutoSync debounce
// (150 ms) plus a conservative round-trip time.
const _SYNC_QUIET_MS = 1000;

function syncEnabledFromServer(){
  // Don't let a stale GET overwrite state that the user just changed.
  if(Date.now() - _lastUserAction < _SYNC_QUIET_MS) return;
  fetch("http://localhost:7420/config",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .catch(()=>null)
    .then(saved=>{
      if(!saved)return;
      // Re-check: if the user acted while the fetch was in flight, discard.
      if(Date.now() - _lastUserAction < _SYNC_QUIET_MS) return;
      Object.keys(state).forEach(name=>{
        if(!saved[name])return;
        const want=!!saved[name].enabled;
        if(state[name].enabled!==want){
          state[name].enabled=want;
          // Update module pill in DOM without a full re-render
          const el=document.querySelector(`[data-module="${CSS.escape(name)}"]`);
          if(el){
            el.classList.toggle("enabled",want);
            // Modern style: update wrap outline
            const wrap=el.closest(".module-wrap");
            if(wrap&&wrap.classList.contains("settings-active")){
              wrap.classList.toggle("module-enabled",want);
            }
          }
        }
      });
    });
}
setInterval(syncEnabledFromServer,16);

    showCategory("Combat",document.querySelector(".category"));
  }
})();

/* ═══════════════════════════════════════════════════════════════════════════
   ArrayList Preview - live canvas renderer
   Mirrors the Java NVG pipeline: exponential-lerp widths, staircase sort,
   square-left/rounded-right cards, optional hue-rotating gradient.
   ═══════════════════════════════════════════════════════════════════════════ */
const _alp = {
  raf: null,
  animWidths: {},   // name → current animated card width (logical px)
  hue: 0,           // current gradient hue offset (degrees)
  lastTime: 0,
};

function alPreviewStart() {
  if (_alp.raf) return;
  _alp.hue = 0;
  _alp.lastTime = performance.now();
  function loop(ts) {
    _alp.raf = requestAnimationFrame(loop);
    const canvas = document.getElementById("al-preview-canvas");
    if (!canvas) { alPreviewStop(); return; }
    _alDraw(canvas, ts);
  }
  _alp.raf = requestAnimationFrame(loop);
}

function alPreviewStop() {
  if (_alp.raf) { cancelAnimationFrame(_alp.raf); _alp.raf = null; }
}

function _alDraw(canvas, ts) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // ── Clear & mock viewport bg ──────────────────────────────────────────
  ctx.clearRect(0, 0, W, H);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1a2638");
  sky.addColorStop(0.62, "#0f1c2e");
  sky.addColorStop(1, "#0a1019");
  ctx.fillStyle = sky;
  ctx.beginPath(); ctx.roundRect(0, 0, W, H, 6); ctx.fill();

  // Horizon fog strip
  ctx.fillStyle = "rgba(30,50,80,0.18)";
  ctx.fillRect(0, H * 0.55, W, H * 0.1);

  // Simple "ground" silhouette
  ctx.fillStyle = "rgba(15,25,15,0.55)";
  ctx.beginPath();
  ctx.rect(0, H * 0.72, W, H);
  ctx.fill();

  // Crosshair
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 7, H / 2); ctx.lineTo(W / 2 - 2, H / 2);
  ctx.moveTo(W / 2 + 2, H / 2); ctx.lineTo(W / 2 + 7, H / 2);
  ctx.moveTo(W / 2, H / 2 - 7); ctx.lineTo(W / 2, H / 2 - 2);
  ctx.moveTo(W / 2, H / 2 + 2); ctx.lineTo(W / 2, H / 2 + 7);
  ctx.stroke();

  // ── Read current ArrayList settings ─────────────────────────────────
  const sv = state["ArrayList"]?.values ?? {};
  const scale      = Math.max(0.1, sv["Scale"]               ?? 1.0);
  const marginX    = sv["Margin X"]                           ?? 2;
  const marginY    = sv["Margin Y"]                           ?? 2;
  const animSpeed  = Math.min(1, Math.max(0.01, sv["Anim Speed"] ?? 0.22));
  const gradient   = sv["Gradient"]                           ?? false;
  const gradSpeed  = sv["Gradient Speed"]                     ?? 1.0;
  const gradSat    = sv["Gradient Saturation"]                ?? 0.8;

  // Advance hue at ~60fps-normalised rate
  const dt = Math.min(50, ts - _alp.lastTime) / 16.67;
  _alp.lastTime = ts;
  if (gradient) _alp.hue = (_alp.hue + gradSpeed * 0.9 * dt) % 360;

  // ── Card layout constants (scaled) ───────────────────────────────────
  const ROW_H    = 13 * scale;
  const H_PAD    = 12 * scale;
  const FONT_SIZE = 7 * scale;
  const RADIUS   = 3 * scale;

  // ── Collect enabled modules (excluding ArrayList itself) ─────────────
  const active = Object.keys(state).filter(
    n => n !== "ArrayList" && state[n] && state[n].enabled
  );

  // ── Measure text widths (canvas font = Inter SemiBold approximation) ─
  ctx.font = `600 ${FONT_SIZE}px Inter, system-ui, sans-serif`;
  const targetWidths = {};
  for (const name of active) {
    const tw = ctx.measureText(name).width;
    targetWidths[name] = tw + H_PAD;
  }

  // ── Sort widest → narrowest (the Cesium staircase convention) ────────
  active.sort((a, b) => (targetWidths[b] ?? 0) - (targetWidths[a] ?? 0));

  // ── Advance width animations ──────────────────────────────────────────
  for (const name of active) {
    const target = targetWidths[name];
    let cur = _alp.animWidths[name];
    if (cur === undefined || cur === 0) cur = target; // seed at target - no slide-from-zero
    _alp.animWidths[name] = cur + (target - cur) * animSpeed;
  }
  // Decay widths for disabled modules
  for (const key of Object.keys(_alp.animWidths)) {
    if (targetWidths[key] === undefined) {
      const v = _alp.animWidths[key] * (1 - animSpeed);
      if (v < 0.5) delete _alp.animWidths[key];
      else _alp.animWidths[key] = v;
    }
  }

  // ── Draw cards ────────────────────────────────────────────────────────
  const rightEdge = W - marginX;
  let y = marginY;

  // Build the draw list (include decaying modules not in active list)
  const drawNames = [
    ...active,
    ...Object.keys(_alp.animWidths).filter(k => !active.includes(k))
  ];

  let cardIndex = 0;
  for (const name of drawNames) {
    const aw = _alp.animWidths[name] ?? 0;
    if (aw < 0.5) { y += ROW_H; continue; }

    const cardX = rightEdge - aw;

    // ── Card background ──────────────────────────────────────────────
    if (gradient) {
      const hue = (_alp.hue + cardIndex * 22) % 360;
      const hue2 = (hue + 38) % 360;
      const s = Math.round(gradSat * 100);
      const grad = ctx.createLinearGradient(cardX, y, cardX + aw, y);
      grad.addColorStop(0, `hsla(${hue},${s}%,58%,0.88)`);
      grad.addColorStop(1, `hsla(${hue2},${s}%,52%,0.88)`);
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = "rgba(10,13,20,0.85)";
    }

    // Rounded rect: tl=0, tr=RADIUS, br=RADIUS, bl=0  (flush to right edge)
    ctx.beginPath();
    ctx.moveTo(cardX, y);
    ctx.lineTo(cardX + aw - RADIUS, y);
    ctx.arcTo(cardX + aw, y,          cardX + aw, y + RADIUS,       RADIUS);
    ctx.arcTo(cardX + aw, y + ROW_H,  cardX + aw - RADIUS, y + ROW_H, RADIUS);
    ctx.lineTo(cardX, y + ROW_H);
    ctx.closePath();
    ctx.fill();

    // Inset top-edge highlight (Cesium glass detail, 9 % white)
    ctx.strokeStyle = "rgba(255,255,255,0.09)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cardX, y + 0.75);
    ctx.lineTo(cardX + aw - RADIUS, y + 0.75);
    ctx.stroke();

    // Module name - centred on card midline
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `600 ${FONT_SIZE}px Inter, system-ui, sans-serif`;
    ctx.fillText(name, cardX + aw / 2, y + ROW_H / 2);

    y += ROW_H;
    cardIndex++;
  }

  // Empty-state hint
  if (active.length === 0 && Object.keys(_alp.animWidths).length === 0) {
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.font = "400 9px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Enable modules to see them here", W / 2, H / 2);
  }
}
</script>
